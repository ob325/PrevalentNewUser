    <text x="494" y="245"
          fill="#5d6169" font-weight="normal" font-size="12">Not eligible: already had surgery</text>
  </g>
  <g opacity="0.38">
    <text x="88" y="287"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 6</text>
    <rect x="92" y="278" width="110.25" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <text x="202.25" y="288"
          text-anchor="middle" fill="#1b1d22" font-size="16" font-weight="bold">&#215;</text>
    <text x="494" y="287"
          fill="#5d6169" font-weight="normal" font-size="12">Not eligible: outcome before index</text>
  </g>
  <line x1="92" y1="304" x2="470" y2="304" stroke="#1b1d22" stroke-width="1.5"/>
  <line x1="92" y1="304" x2="92" y2="309" stroke="#1b1d22" stroke-width="1.5"/>
  <text x="92" y="321" text-anchor="middle" fill="#1b1d22" font-size="12">0</text>
  <line x1="186.5" y1="304" x2="186.5" y2="309" stroke="#1b1d22" stroke-width="1.5"/>
  <text x="186.5" y="321" text-anchor="middle" fill="#1b1d22" font-size="12">6</text>
  <line x1="281" y1="304" x2="281" y2="309" stroke="#1b1d22" stroke-width="1.5"/>
  <text x="281" y="321" text-anchor="middle" fill="#1b1d22" font-size="12">12</text>
  <line x1="375.5" y1="304" x2="375.5" y2="309" stroke="#1b1d22" stroke-width="1.5"/>
  <text x="375.5" y="321" text-anchor="middle" fill="#1b1d22" font-size="12">18</text>
  <line x1="470" y1="304" x2="470" y2="309" stroke="#1b1d22" stroke-width="1.5"/>
  <text x="470" y="321" text-anchor="middle" fill="#1b1d22" font-size="12">24</text>
  <text x="281" y="337" text-anchor="middle" fill="#5d6169" font-size="11">Months since starting a GLP-1 RA</text>
  <rect x="100" y="357" width="24" height="10"
        fill="#a3a6ad" rx="2.5"/>
  <text x="130" y="366" fill="#1b1d22" font-size="12">On GLP-1 RA</text>
  <polygon points="252,355 259,362 252,369 245,362"
           fill="#3448b5"/>
  <text x="266" y="366" fill="#1b1d22" font-size="12">Surgery</text>
  <text x="355" y="367"
        text-anchor="middle" fill="#1b1d22" font-size="14" font-weight="bold">&#215;</text>
  <text x="366" y="366" fill="#1b1d22" font-size="12">Outcome</text>
</svg>
