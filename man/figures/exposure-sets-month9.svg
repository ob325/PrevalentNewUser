<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 375" width="760" height="375"
     role="img">
  <title>Prevalent new-user design: comparator selection, index at month 9</title>
  <style>
    text {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }
  </style>
  <rect width="760" height="375" fill="#ffffff"/>
  <line x1="92" y1="52" x2="92" y2="304" stroke="#d9d9d2" stroke-width="1"/>
  <line x1="186.5" y1="52" x2="186.5" y2="304" stroke="#d9d9d2" stroke-width="1"/>
  <line x1="281" y1="52" x2="281" y2="304" stroke="#d9d9d2" stroke-width="1"/>
  <line x1="375.5" y1="52" x2="375.5" y2="304" stroke="#d9d9d2" stroke-width="1"/>
  <line x1="470" y1="52" x2="470" y2="304" stroke="#d9d9d2" stroke-width="1"/>
  <rect x="4" y="54" width="752" height="38"
        fill="#1d7a5c" fill-opacity="0.12" rx="2"/>
  <rect x="4" y="96" width="752" height="38"
