  <line x1="233.75" y1="20" x2="233.75" y2="304"
        stroke="#3448b5" stroke-width="2"/>
  <text x="233.75" y="16" text-anchor="middle" fill="#3448b5" font-weight="bold" font-size="12">Index: month 9</text>
  <g>
    <text x="88" y="77"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 1</text>
    <rect x="92" y="68" width="378" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <text x="494" y="77"
          fill="#1d7a5c" font-weight="bold" font-size="12">Comparator: on GLP-1 RA</text>
  </g>
  <g>
    <text x="88" y="119"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 2</text>
    <rect x="92" y="110" width="141.75" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <line x1="233.75" y1="115" x2="470" y2="115"
          stroke="#3448b5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="233.75,108 240.75,115 233.75,122 226.75,115"
             fill="#3448b5"/>
    <text x="494" y="119"
          fill="#3448b5" font-weight="bold" font-size="12">Switcher: surgery at month 9</text>
  </g>
  <g>
    <text x="88" y="161"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 3</text>
    <rect x="92" y="152" width="378" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <text x="494" y="161"
          fill="#1d7a5c" font-weight="bold" font-size="12">Comparator: on GLP-1 RA</text>
  </g>
  <g opacity="0.38">
    <text x="88" y="203"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 4</text>
    <rect x="92" y="194" width="94.5" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <text x="494" y="203"
          fill="#5d6169" font-weight="normal" font-size="12">Not eligible: stopped GLP-1 RA</text>
  </g>
  <g opacity="0.38">
    <text x="88" y="245"
          text-anchor="end" fill="#1b1d22" font-weight="bold" font-size="12">Patient 5</text>
    <rect x="92" y="236" width="63" height="10"
          fill="#a3a6ad" rx="2.5"/>
    <line x1="155" y1="241" x2="470" y2="241"
          stroke="#3448b5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="155,234 162,241 155,248 148,241"
